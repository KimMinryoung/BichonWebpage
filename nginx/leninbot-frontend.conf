# Rate limit only the API paths (per client IP). The map yields an empty key
# for everything else, and nginx skips limiting when the key is empty, so one
# `limit_req` in `location /` covers the site without duplicating the proxy
# block. 10 r/s with a burst of 20 is far above any browser's use.
map $request_uri $api_limit_key {
    default "";
    ~^/commulingo/api/ $binary_remote_addr;
    ~^/api/proxy/      $binary_remote_addr;
}
limit_req_zone $api_limit_key zone=frontend_api:10m rate=10r/s;
limit_req_status 429;

# Keep-alive pool to Node: without an upstream block nginx opens a fresh
# connection per request (Node's keepAliveTimeout is set to 65 s to outlive
# nginx's 60 s default on these sockets).
upstream frontend_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name cyber-lenin.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cyber-lenin.com;

    ssl_certificate /etc/ssl/cloudflare/cyber-lenin.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/cyber-lenin.com.key;

    # Compress text at the origin as well (the app's compression middleware
    # covers Node responses; this also covers anything nginx answers itself
    # and lets Node's gzip stay off for streaming paths).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/markdown text/xml application/json application/javascript application/xml application/atom+xml application/rss+xml image/svg+xml;

    # Defense-in-depth: admin is Tailscale-only, block public path entirely
    location /admin {
        return 404;
    }

    location / {
        limit_req zone=frontend_api burst=20 nodelay;
        proxy_pass http://frontend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 스트리밍 프록시 지원 (채팅/writer SSE). 백엔드는 15초 간격 ping을
        # 보내므로 read timeout은 백엔드 자체 idle cutoff(240s)보다 넉넉하게.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

# Tailscale-only admin access (plain HTTP over Tailscale's encrypted transport)
server {
    listen 100.122.248.77:80 default_server;
    server_name _;

    location / {
        proxy_pass http://frontend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
