server {
    listen 80;
    server_name cyber-lenin.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name cyber-lenin.com;

    ssl_certificate /etc/ssl/cloudflare/cyber-lenin.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/cyber-lenin.com.key;

    # Defense-in-depth: admin is Tailscale-only, block public path entirely
    location /admin {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 스트리밍 프록시 지원 (채팅/writer SSE). 백엔드는 15초 간격 ping을
        # 보내므로 read timeout은 백엔드 자체 idle cutoff(240s)보다 넉넉하게.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

# Tailscale-only admin access (plain HTTP over Tailscale's encrypted transport)
server {
    listen 100.122.248.77:80 default_server;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
