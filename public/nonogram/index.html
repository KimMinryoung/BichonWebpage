<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>노노그램으로 이동 중</title>
  <script>
    (function () {
      var url = new URL(window.location.href);
      url.searchParams.delete("v");
      window.location.replace("/nonogram/" + (url.search ? url.search : ""));
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=/nonogram/">
  </noscript>
</head>
<body>
  <p><a href="/nonogram/">노노그램으로 이동</a></p>
</body>
</html>
